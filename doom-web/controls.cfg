// Replace inherited console, episode menus, save/load and automap bindings.
unbindall
// Keep a little walking motion, with much gentler view and weapon bob.
movebob 0.05
stillbob 0
bind w "+forward"
bind s "+back"
bind a "+moveleft"
bind d "+moveright"
// Space uses switches and releases, like original Doom; E stays as a quiet
// alias for players with modern habits. Doors open when you walk into them.
bind space "+use"
bind e "+use"
bind uparrow "+forward"
bind downarrow "+back"
bind leftarrow "+left"
bind rightarrow "+right"
bind pgup "+lookup"
bind pgdn "+lookdown"
bind shift "+speed"
// Click (or Ctrl, Doom's fire key) swings the wrench or draws the slingshot.
bind mouse1 "+attack"
bind ctrl "+attack"
bind rctrl "+attack"
bind q "netevent pdoom_order"
bind g "netevent pdoom_give"
bind r "netevent pdoom_finish"
bind t "netevent pdoom_tool"
bind f12 "netevent pdoom_practice"
// Low ducts crouch you automatically; C remains as a manual fallback.
bind c "+crouch"

bind f5 "netevent pdoom_restart"
bind f4 "netevent pdoom_ready"
bind f3 "netevent pdoom_prologue_skip"
bind f6 "netevent pdoom_enter_control"
bind f7 "netevent pdoom_enter_hal"
bind f8 "netevent pdoom_replay_control"
bind f9 "netevent pdoom_replay_hal"

bind 1 "netevent pdoom_answer1"
bind 2 "netevent pdoom_answer2"
bind 3 "netevent pdoom_answer3"
bind 4 "netevent pdoom_war4"
bind 5 "netevent pdoom_war5"
